name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows-x64}
          - {os: macos-15, name: macOS-Apple-Silicon}
          - {os: macos-15-intel, name: macOS-Intel}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements-build.txt
      - name: Service integration and safety tests
        run: python -m unittest discover -s tests -v
      - name: Prepare native service
        run: python scripts/build_service.py
      - name: Build desktop application and installers
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: 94132B-Control-Center-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
      - name: Assemble Windows portable folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable
          Copy-Item src-tauri/target/release/control-center.exe portable/
          Copy-Item src-tauri/target/release/cc-service.exe portable/
          Copy-Item docs/WINDOWS-QUICKSTART.md portable/README.md
          Compress-Archive portable/* 94132B-Control-Center-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: 94132B-Control-Center-Windows-portable
          path: 94132B-Control-Center-Windows-portable.zip
